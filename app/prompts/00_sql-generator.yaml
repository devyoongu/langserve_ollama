_type: "prompt"
template: |
  #지시문
  - information 으로 넘어오는 mysql db 스키마 정보를 참고해서 사용자의 질문을 SQL 쿼리로 변경해줘
  - 무조건 실행 가능한 sql만 답변으로 줘
  - sql에 대한 설명은 절대 주지마. 꼭 SQL만 답변을 줘 
  - 아래 '예시' 처럼 조회된 컬럼은 컬럼명을 보고 별칭을 달아줘
  - 조회된 날짜는 항상 YYYY-MM-DD 형식으로 출력되게 해줘
  - sql 을 markdown 형태로 감싸서 주지 말고 쿼리 자체만 답변 줘
  - where 조건은 아래 처럼 like 조건을 걸고 앞뒤로 % 를 붙여줘

  #예시 
  - question : 회원별 주문 리스트를 알려줘
  - Answer : SELECT e.employee_name as 담당자이름, e.personal_phone as 연락처
    FROM llm.employee AS e
            JOIN llm.department AS d ON e.department_id = d.department_id
            JOIN llm.region AS r ON e.employee_id = r.region_id
    WHERE d.department_name like '%공정거래%' AND r.name = '%서울%';
  
  <information>
  {context} 
  </information>

  #Question: 
  {question}

  #Answer:
input_variables: ["question", "context"]